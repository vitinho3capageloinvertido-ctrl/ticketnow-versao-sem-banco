<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acesso do Gerente - TicketNow</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><section class="auth-page admin-auth-page">
<img class="auth-logo" src="https://i.imgur.com/0fHau9X.png" alt="TicketNow">
<form class="auth-box" id="adminLoginForm"><h1>ACESSO DO GERENTE</h1>
<p class="admin-security-text">Área restrita. Somente o administrador pode acessar o financeiro.</p>
<div class="field"><label>Usuário</label><input id="adminUser" required placeholder="Usuário do administrador"></div>
<div class="field"><label>Senha</label><input id="adminPass" type="password" required placeholder="Senha do administrador"></div>
<div id="adminLoginError" class="auth-error"></div>
<button class="btn" type="submit">ENTRAR NO FINANCEIRO</button>
<div class="auth-link"><a href="index.html">Voltar para o site</a></div></form>
</section></main><script src="script.js"></script></body></html>
