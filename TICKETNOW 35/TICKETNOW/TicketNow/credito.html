<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Cartão de crédito - TicketNow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="header">
      <!-- IMAGEM: logo TicketNow do cabecalho -->
      <img class="logo" src="https://i.imgur.com/0fHau9X.png" alt="TicketNow"
        onclick="window.location.href='index.html'" style="cursor:pointer">
      <nav class="nav">
        <a href="index.html">EVENTOS</a>
        <a href="index.html#categorias">CATEGORIAS</a>
        <a href="sobrenos.html">SOBRE NÓS</a>
      </nav>
      <div class="header-icons">
        <a class="icon-btn bag-button" href="carrinho.html" aria-label="Sacola de compras">
          <span class="bag-icon" aria-hidden="true"></span><span class="bag-count">0</span>
        </a>
        <a class="icon-btn profile-button" href="login.html" aria-label="Minha conta">
          <span class="profile-icon" aria-hidden="true"></span>
        </a>
      </div>
    </header>
    <div class="content"><a class="back" href="pagamento.html">←</a>
      <form class="form-card" id="creditForm">
        <h2>Cartão de crédito</h2>
        <p style="font-size:12px;margin-bottom:15px">Valor da compra <b id="creditTotal"></b></p>
        <div class="field"><label>Número do cartão *</label><input id="cardNumber" required inputmode="numeric"
            placeholder="0000 0000 0000 0000" maxlength="19"></div>
        <div class="field"><label>Nome impresso no cartão *</label><input required placeholder="Nome"></div>
        <div class="form-grid">
          <div class="field"><label>Validade *</label><input required placeholder="MM/AA" maxlength="5"></div>
          <div class="field"><label>CVV *</label><input required type="password" maxlength="4" placeholder="000"></div>
        </div>
        <div class="field"><label>Parcelamento *</label><select required>
            <option value="">Selecione</option>
            <option>1x sem juros</option>
            <option>2x sem juros</option>
            <option>3x sem juros</option>
            <option>6x com juros</option>
            <option>12x com juros</option>
          </select></div>
        <button class="btn" type="submit">FINALIZAR PAGAMENTO</button>
      </form>
    </div>
    <footer class="footer">
      <div class="footer-grid">
        <div>
          <!-- IMAGEM: logo TicketNow do rodape -->
          <img class="footer-logo" src="https://i.imgur.com/0fHau9X.png" alt="TicketNow"
            onclick="window.location.href='index.html'" style="cursor:pointer">
          <p>Sua plataforma de confiança para descobrir os melhores eventos e garantir seus ingressos.</p>
        </div>
        <div>
          <h4>NAVEGAÇÃO</h4>
          <p><a href="index.html">Eventos</a></p>
          <p><a href="sobrenos.html">Sobre nós</a></p>
        </div>
        <div>
          <h4>AJUDA</h4>
          <p><a href="sobrenos.html">Sobre nós</a></p>
        </div>
        <div>
          <h4>SIGA-NOS</h4>
          <p>◎ @Ticketnowofc</p>
        </div>
      </div>
      <div class="footer-bottom">© 2026 ticketNow. Todos os direitos reservados</div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>

</html>
