<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação de ingresso - TicketNow</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="content"><section class="form-card" id="validationResult"><h1>CONSULTA DE INGRESSO</h1><p>Verificando ingresso…</p></section></div></main><script src="script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let p=[];try{p=JSON.parse(localStorage.getItem('ticketnow_purchases')||'[]')}catch(e){}const id=new URLSearchParams(location.search).get('pedido');const t=p.find(x=>String(x.pedido)===id);const box=document.getElementById('validationResult');if(!t){box.innerHTML='<h1>INGRESSO NÃO LOCALIZADO</h1><p>Não foi possível confirmar este ingresso neste dispositivo. A validação em qualquer aparelho exige uma base de dados centralizada.</p><p><b>Pedido consultado:</b> '+(id||'não informado')+'</p>';return}const ev=EVENTS[t.evento]||EVENTS[1];box.innerHTML='<h1>INGRESSO REGISTRADO</h1><p class="ticket-status">REGISTRO ENCONTRADO NESTE DISPOSITIVO</p><h2>'+ev.nome+'</h2><p><b>Pedido:</b> '+t.pedido+'</p><p><b>Setor:</b> '+t.setor+'</p><p><b>Quantidade:</b> '+t.qtd+'</p><p><b>Comprador:</b> '+((t.cliente||{}).nome||'Não informado')+'</p><p><b>Data da compra:</b> '+new Date(t.compradoEm).toLocaleString('pt-BR')+'</p><p>Para validar entradas de forma confiável em dispositivos diferentes, conecte o site a um serviço de validação com servidor.</p>';});</script></body></html>
